<!DOCTYPE HTML>
<html lang="sv">
<head>
  <title>About | Dist Studios</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Source Sans 3', sans-serif;
      background-color: #14110f;
      color: #fff;
    }

    .background-image {
      position: fixed;
      inset: -20px;
      background-image: url('pexels-rdne-8198567.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.40);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 1.25rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    p {
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.9);
      max-width: 680px;
      line-height: 1.6;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
    }

    .back-link {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="background-image" aria-hidden="true"></div>
  <main class="content">
    <a class="back-link" href="./">← Dist Studios</a>
    <h1>About</h1>
    <p>Dist Studios is a music collective and studio based in Stockholm, Sweden.</p>
  </main>
</body>
</html>
