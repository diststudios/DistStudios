<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14110f">
  <title>Dist Studios</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap');
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; width: 100%; margin: 0; overflow-x: hidden; }
    body {
      min-height: 100vh;
      color: #fff;
      font-family: 'Source Sans 3', sans-serif;
      background-color: #14110f;
    }
    .background-image {
      position: fixed;
      inset: 0;
      background-image: url('./assets:studio-background-2.0.jpg');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }
    .site-header { position: fixed; z-index: 3; top: 0; right: 0; left: 0; width: 100%; padding: 1rem 1rem 0; text-align: center; background: rgba(20,17,15,0.82); backdrop-filter: blur(10px); }
    .brand { display: inline-block; margin: 0 0 0.55rem; color: #fff; font-size: clamp(1.45rem, 3.2vw, 2rem); line-height: 1.1; font-weight: 600; letter-spacing: 0.045em; text-decoration: none; }
    .tabs { display: flex; justify-content: center; gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.25); }
    .tab { position: relative; display: inline-block; min-width: 110px; padding: 0.7rem 1rem 0.8rem; color: rgba(255,255,255,0.72); font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
    .tab:hover, .tab[aria-current="page"] { color: #fff; }
    .tab[aria-current="page"]::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: #c9a879; content: ""; }
    .tab:focus-visible { outline: 2px solid #c9a879; outline-offset: 3px; border-radius: 3px; }
    .hero { min-height: 100vh; }
    @media (max-width: 500px) {
      .tabs { gap: 0.15rem; }
      .tab { min-width: 0; flex: 1; padding-inline: 0.4rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="background-image" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./">Dist Studios</a>
    <nav class="tabs" aria-label="Dist Studios sections">
      <a class="tab" href="./songs.html">Songs</a>
      <a class="tab" href="./mixing.html">Mixing</a>
      <a class="tab" href="./about.html">About</a>
    </nav>
  </header>
  <main class="hero" aria-label="Dist Studios"></main>
</body>
</html>
