<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Dist Studios</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f3ef;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: radial-gradient(ellipse at 50% 35%, #29251f 0, #171614 42%, #111 78%);
    }

    main {
      width: min(100%, 680px);
      text-align: center;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.045em;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      border-bottom: 1px solid #49443c;
    }

    .tab {
      position: relative;
      display: inline-block;
      min-width: 130px;
      padding: 0.9rem 1.25rem 1rem;
      border: 0;
      background: transparent;
      color: #aaa59d;
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: color 160ms ease;
    }

    .tab:hover,
    .tab[aria-current="page"],
    .tab[aria-pressed="true"] { color: #fff; }

    .tab[aria-current="page"]::after,
    .tab[aria-pressed="true"]::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: #c9a879;
      content: "";
    }

    .tab:focus-visible {
      outline: 2px solid #c9a879;
      outline-offset: 3px;
      border-radius: 3px;
    }

    .panel {
      min-height: 100px;
      padding: 2rem 1rem;
      color: #aaa59d;
    }

    .panel h2 {
      margin: 0;
      color: #f5f3ef;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    @media (max-width: 420px) {
      .tab { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Dist Studios</h1>

    <nav class="tabs" aria-label="Dist Studios sections">
      <a class="tab" href="./mixing.html" aria-current="page">Mixing</a>
      <button class="tab" id="songs-tab" type="button" aria-pressed="false" aria-controls="songs-panel">Songs</button>
    </nav>

    <section class="panel" id="songs-panel" hidden>
      <h2>Songs</h2>
    </section>
  </main>

  <script>
    const songsTab = document.getElementById('songs-tab');
    const songsPanel = document.getElementById('songs-panel');

    songsTab.addEventListener('click', () => {
      const showingSongs = songsTab.getAttribute('aria-pressed') !== 'true';
      songsTab.setAttribute('aria-pressed', String(showingSongs));
      songsPanel.hidden = !showingSongs;
    });
  </script>
</body>
</html>
