<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Dist Studios</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f3ef;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: radial-gradient(ellipse at 50% 35%, #29251f 0, #171614 42%, #111 78%);
    }

    main {
      width: min(100%, 680px);
      text-align: center;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.045em;
    }

    [role="tablist"] {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      border-bottom: 1px solid #49443c;
    }

    [role="tab"] {
      position: relative;
      min-width: 130px;
      padding: 0.9rem 1.25rem 1rem;
      border: 0;
      background: transparent;
      color: #aaa59d;
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 160ms ease;
    }

    [role="tab"]:hover,
    [role="tab"][aria-selected="true"] { color: #fff; }

    [role="tab"][aria-selected="true"]::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: #c9a879;
      content: "";
    }

    [role="tab"]:focus-visible {
      outline: 2px solid #c9a879;
      outline-offset: 3px;
      border-radius: 3px;
    }

    [role="tabpanel"] {
      min-height: 100px;
      padding: 2rem 1rem;
      color: #aaa59d;
    }

    [role="tabpanel"] h2 {
      margin: 0;
      color: #f5f3ef;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    @media (max-width: 420px) {
      [role="tab"] { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Dist Studios</h1>

    <div role="tablist" aria-label="Dist Studios sections">
      <button id="mixing-tab" type="button" role="tab" aria-selected="true" aria-controls="mixing-panel" tabindex="0">Mixing</button>
      <button id="songs-tab" type="button" role="tab" aria-selected="false" aria-controls="songs-panel" tabindex="-1">Songs</button>
    </div>

    <section id="mixing-panel" role="tabpanel" aria-labelledby="mixing-tab">
      <h2>Mixing</h2>
    </section>
    <section id="songs-panel" role="tabpanel" aria-labelledby="songs-tab" hidden>
      <h2>Songs</h2>
    </section>
  </main>

  <script>
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));

    function activateTab(tab, moveFocus = false) {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
      });
      if (moveFocus) tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => activateTab(tab));
      tab.addEventListener('keydown', (event) => {
        let nextIndex;
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
        if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === 'Home') nextIndex = 0;
        if (event.key === 'End') nextIndex = tabs.length - 1;
        if (nextIndex !== undefined) {
          event.preventDefault();
          activateTab(tabs[nextIndex], true);
        }
      });
    });
  </script>
</body>
</html>
