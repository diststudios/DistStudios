<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14110f">
  <title>Dist Studios</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Source+Sans+3:wght@300;400;600&display=swap');
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; width: 100%; margin: 0; overflow-x: hidden; }
    body { min-height: 100vh; color: #fff; font-family: 'Source Sans 3', sans-serif; background-color: #14110f; }
    .background-image { position: fixed; inset: 0; background-image: url('./Dist%20Main.jpg'); background-size: cover; background-position: center; z-index: -1; }
    .site-header { position: fixed; z-index: 3; top: 0; right: 0; left: 0; width: 100%; padding: 1.25rem 1rem 0; text-align: center; background: rgba(20,17,15,0.82); backdrop-filter: blur(10px); }
    .brand { position: absolute; top: 0.8rem; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'Monoton', cursive; font-size: clamp(1.5rem, 3vw, 2.25rem); letter-spacing: 0.15em; text-decoration: none; white-space: nowrap; }
    .tabs { display: flex; justify-content: center; gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.25); padding-top: 2.25rem; }
    .tab { position: relative; display: inline-block; min-width: 110px; padding: 0.7rem 1rem 0.8rem; color: rgba(255,255,255,0.72); font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
    .tab:hover, .tab[aria-current="page"] { color: #fff; }
    .tab[aria-current="page"]::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: #c9a879; content: ""; }
    .tab:focus-visible { outline: 2px solid #c9a879; outline-offset: 3px; border-radius: 3px; }
    .hero { min-height: 100vh; padding: 8rem 1.5rem 3rem; }
    .music-section { width: min(100%, 1100px); margin: 0 auto; }
    .music-section h1 { margin: 0 0 1.5rem; text-align: center; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 600; letter-spacing: 0.04em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .spotify-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
    .spotify-card { display: block; min-width: 0; overflow: hidden; aspect-ratio: 1; border-radius: 12px; background: rgba(20,17,15,0.7); box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: transform 160ms ease, box-shadow 160ms ease; }
    .spotify-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.65); }
    .spotify-card:focus-visible { outline: 3px solid #c9a879; outline-offset: 4px; }
    .spotify-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 800px) { .spotify-grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; } }
    @media (max-width: 500px) { .site-header { padding-inline: 0.5rem; } .brand { font-size: 1.2rem; } .tabs { gap: 0.15rem; } .tab { min-width: 0; flex: 1; padding-inline: 0.4rem; font-size: 0.8rem; } .hero { padding: 7.5rem 1rem 2rem; } }
    @media (prefers-reduced-motion: reduce) { .spotify-card { transition: none; } }
  </style>
</head>
<body>
  <div class="background-image" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./">Dist Studios</a>
    <nav class="tabs" aria-label="Dist Studios sections">
      <a class="tab" href="./songs.html">Songs</a>
      <a class="tab" href="./mixing.html">Mixing</a>
      <a class="tab" href="./about.html">About</a>
    </nav>
  </header>
  <main class="hero" aria-label="Dist Studios">
    <section class="music-section" aria-labelledby="featured-tracks">
      <h1 id="featured-tracks">Featured Tracks</h1>
      <div class="spotify-grid">
        <a class="spotify-card" href="https://open.spotify.com/track/0okwFF4kt2tFoT9R5MDnxW" target="_blank" rel="noopener noreferrer" aria-label="Listen to this track on Spotify" data-track-id="0okwFF4kt2tFoT9R5MDnxW"></a>
        <a class="spotify-card" href="https://open.spotify.com/track/0XAODhfZsYi5SaS4nTRWdV" target="_blank" rel="noopener noreferrer" aria-label="Listen to this track on Spotify" data-track-id="0XAODhfZsYi5SaS4nTRWdV"></a>
        <a class="spotify-card" href="https://open.spotify.com/track/20JYmd4p72UjSiF3DLAHXA" target="_blank" rel="noopener noreferrer" aria-label="Listen to this track on Spotify" data-track-id="20JYmd4p72UjSiF3DLAHXA"></a>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.spotify-card[data-track-id]').forEach(async (card) => {
      const trackUrl = `https://open.spotify.com/track/${card.dataset.trackId}`;
      try {
        const response = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(trackUrl)}`);
        if (!response.ok) throw new Error('Spotify artwork request failed');
        const track = await response.json();
        const cover = document.createElement('img');
        cover.src = track.thumbnail_url;
        cover.alt = `${track.title} cover art`;
        cover.loading = 'lazy';
        card.setAttribute('aria-label', `Listen to ${track.title} on Spotify`);
        card.append(cover);
      } catch (error) {
        console.error('Unable to load Spotify cover art:', error);
      }
    });
  </script>
</body>
</html>
