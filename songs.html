<!DOCTYPE HTML>
<html lang="sv">
<head>
  <title>Songs by Dist Studios</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Source+Sans+3:wght@300;400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; width: 100%; overflow-x: hidden; font-family: 'Source Sans 3', sans-serif; background-color: #14110f; color: #fff; }
    .background-image { position: fixed; inset: -8px; background-image: url('./Dist%20Main.jpg'); background-size: cover; background-position: center; filter: blur(4px); z-index: 1; }
    .site-header { position: fixed; z-index: 3; top: 0; right: 0; left: 0; padding: 1.25rem 1rem 0; text-align: center; background: rgba(20,17,15,0.82); backdrop-filter: blur(10px); }
    .brand { position: absolute; top: 0.8rem; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'Monoton', cursive; font-size: clamp(1.5rem, 3vw, 2.25rem); letter-spacing: 0.15em; text-decoration: none; white-space: nowrap; }
    .tabs { display: flex; justify-content: center; gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.25); padding-top: 2.25rem; }
    .tab { position: relative; display: inline-block; min-width: 110px; padding: 0.7rem 1rem 0.8rem; color: rgba(255,255,255,0.72); font-size: 0.95rem; letter-spacing: 0.08em; text-align: center; text-transform: uppercase; text-decoration: none; }
    .tab:hover, .tab[aria-current="page"] { color: #fff; }
    .tab[aria-current="page"]::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: #c9a879; content: ""; }
    .tab:focus-visible { outline: 2px solid #c9a879; outline-offset: 2px; }
    .content { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 7rem 1.5rem 3rem; }
    h2 { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 600; letter-spacing: 0.03em; margin-bottom: 1.25rem; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .spotify-container { width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; }
    .spotify-container iframe { display: block; height: 500px; }
    @media (max-width: 500px) { .site-header { padding-inline: 0.5rem; } .brand { font-size: 1.2rem; } .tabs { gap: 0.15rem; } .tab { min-width: 0; flex: 1; padding-inline: 0.4rem; font-size: 0.8rem; } }
  </style>
</head>
<body>
  <div class="background-image" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./">Dist Studios</a>
    <nav class="tabs" aria-label="Dist Studios sections">
      <a class="tab" href="./songs.html">Playlist</a>
      <a class="tab" href="./mixing.html">Mixing</a>
      <a class="tab" href="./about.html">About</a>
    </nav>
  </header>
  <main class="content">
    <h2>Songs by Dist Studios</h2>
    <div class="spotify-container">
      <iframe title="Spotify playlist of songs by Dist Studios" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5SUMZ0GDupjDi8vqt2UYIe?utm_source=generator&amp;si=b024c03504ec4ea7" width="100%" height="500" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>
  </main>
</body>
</html>
